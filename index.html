<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Innenkultur – Leben &amp; Liebe</title>
<meta name="theme-color" content="#F4F6FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Innenkultur">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1220;--sub:#5B6475;--line:#EEF1F6;--bd:#D5DBE7;--bg:#F4F6FB;
  --gL:linear-gradient(135deg,#047857 0%,#0E7490 55%,#1D4ED8 100%);
  --gR:linear-gradient(135deg,#BE123C 0%,#BE185D 55%,#A21CAF 100%);
  --gX:linear-gradient(90deg,#0E7490 0%,#1D4ED8 40%,#7C3AED 70%,#BE185D 100%);
  --gHero:linear-gradient(150deg,#047857 0%,#1D4ED8 45%,#6D28D9 75%,#BE185D 100%);
  --dots:radial-gradient(rgba(255,255,255,.15) 1.2px,transparent 1.4px) 0 0/14px 14px;
  --sh:0 6px 20px rgba(15,23,42,.06);--sh2:0 12px 30px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7C3AED;outline-offset:2px}
h1,h2,h3,.jk{font-family:"Plus Jakarta Sans",Inter,sans-serif;letter-spacing:-.02em}
h1{margin:0;font-size:26px;font-weight:800}
h2{margin:0;font-size:17px;font-weight:800}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:calc(18px + env(safe-area-inset-top)) 16px 24px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column}
.sub{font-size:12px;color:var(--sub)}
.small{font-size:13px;color:var(--sub);line-height:1.45}
.card{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:10px}
.list{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:4px 16px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.iconbtn{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 4px 14px rgba(15,23,42,.08);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn.glass{background:rgba(255,255,255,.18);box-shadow:none;color:#fff}
.btn{min-height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:800;font-size:15px;background:var(--gX);box-shadow:0 8px 20px rgba(124,58,237,.3);width:100%}
.btn.L{background:var(--gL);box-shadow:0 8px 20px rgba(29,78,216,.3)}.btn.R{background:var(--gR);box-shadow:0 8px 20px rgba(190,24,93,.3)}
.btn.white{background:#fff;color:#3B0764;box-shadow:0 10px 30px rgba(15,23,42,.25)}
.btn:disabled{opacity:.6}
.ghost{min-height:46px;border-radius:14px;background:#fff;border:1px solid var(--bd);font-weight:700;width:100%}
.link{font-size:13px;font-weight:700;color:var(--sub);min-height:40px}
.gradL{background:var(--dots),var(--gL)}.gradR{background:var(--dots),var(--gR)}
.score{position:relative;overflow:hidden;border-radius:22px;padding:14px 16px;color:#fff;display:flex;flex-direction:column;gap:2px}
.score.L{box-shadow:0 10px 24px rgba(14,116,144,.3)}.score.R{box-shadow:0 10px 24px rgba(190,24,93,.3)}
.score b.n{font-family:"Plus Jakarta Sans",sans-serif;font-size:36px;font-weight:800;line-height:1.1}
.pill{padding:3px 8px;border-radius:8px;font-size:11px;font-weight:800}
.pill.L{background:#ECFDF5;color:#065F46}.pill.R{background:#FFF1F2;color:#9F1239}.pill.N{background:#EEF1F6;color:#334155}.pill.W{background:rgba(255,255,255,.22);color:#fff}
.seg5{display:grid;grid-template-columns:repeat(5,38px);gap:4px;padding:3px;border-radius:12px;background:#EEF1F6;flex:none}
.seg5 button{height:38px;border-radius:9px;font-size:13px;font-weight:700;color:var(--sub)}
.seg5 button.on{color:#fff;font-weight:800}
.L .seg5 button.on,.seg5.L button.on{background:var(--gL);box-shadow:0 4px 10px rgba(29,78,216,.3)}
.seg5.R button.on{background:var(--gR);box-shadow:0 4px 10px rgba(190,24,93,.3)}
.seg5.W button.on{background:linear-gradient(135deg,#D97706,#BE123C);box-shadow:0 4px 10px rgba(190,18,60,.3)}
.rate{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:20px;border:1px solid var(--bd);background:#fff;font-size:13px;font-weight:600;color:#334155}
.chip small{color:var(--sub);font-weight:600}
.chip.on{border-color:transparent;color:#fff;font-weight:700}.chip.on small{color:rgba(255,255,255,.85)}
.chip.on.L{background:var(--gL)}.chip.on.R{background:var(--gR)}
.chip.ctx{border-style:dashed}.chip.ctx.on{background:#EEF1F6;color:#334155;border:1px solid #94A3B8}
.chip.add{border-style:dashed;border-color:#94A3B8}
.step{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px;display:flex;flex-direction:column;gap:8px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--bg);font-size:20px}
.stepper b{font-family:"Plus Jakarta Sans",sans-serif;font-size:20px;font-weight:800}
textarea,input[type=text],input[type=url],input[type=password]{width:100%;border:1px solid var(--bd);border-radius:16px;padding:12px 14px;font-size:15px;background:#fff;resize:none}
input[type=text]:focus,textarea:focus{border-color:#1D4ED8}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid #CBD2E0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.box.on{border:none;background:var(--gX)}
.good{border-radius:20px;padding:14px 16px;background:linear-gradient(135deg,#ECFDF5 0%,#EFF6FF 100%);border:1px solid #A7F3D0;display:flex;gap:12px}
.warn{border-radius:20px;padding:14px 16px;background:linear-gradient(135deg,#FFFBEB 0%,#FFF1F2 100%);border:1px solid #FDE68A;display:flex;gap:12px}
.good .ic,.warn .ic{flex:none;width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.good .ic{background:var(--gL)}.warn .ic{background:linear-gradient(135deg,#D97706,#BE123C)}
.good b{color:#065F46}.good span{color:#134E4A}.warn b{color:#92400E}.warn span{color:#78350F}
.good span,.warn span{font-size:13px;line-height:1.45}
.reco{position:relative;overflow:hidden;border-radius:22px;padding:16px 18px;color:#fff;background:radial-gradient(circle at 100% 0%,rgba(255,255,255,.22) 0 60px,rgba(255,255,255,0) 61px),linear-gradient(135deg,#1D4ED8 0%,#6D28D9 60%,#BE185D 100%);display:flex;flex-direction:column;gap:6px}
.cap{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.behind{border-radius:20px;padding:14px 16px;background:#FFFBEB;border:1px solid #FDE68A;display:flex;flex-direction:column;gap:8px}
.head{padding:calc(16px + env(safe-area-inset-top)) 18px 16px;display:flex;flex-direction:column;gap:14px;color:#fff;border-radius:0 0 28px 28px}
.head.L{background:var(--dots),var(--gL);box-shadow:0 10px 30px rgba(14,116,144,.25)}
.head.R{background:repeating-radial-gradient(circle at 100% 0%,rgba(255,255,255,.12) 0 2px,rgba(255,255,255,0) 2px 18px),var(--gR);box-shadow:0 10px 30px rgba(190,24,93,.25)}
.prog{display:grid;grid-template-columns:1fr 1fr;gap:6px}.prog i{height:6px;border-radius:3px;background:rgba(255,255,255,.3)}.prog i.on{background:#fff}
.foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -6px 20px rgba(15,23,42,.06);display:flex;flex-direction:column;gap:8px}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -6px 20px rgba(15,23,42,.06)}
nav.tabs button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--sub)}
nav.tabs button.on{color:#1D4ED8}
nav.tabs .plus{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1D4ED8,#BE185D)}
.hero{padding:calc(24px + env(safe-area-inset-top)) 20px 64px;color:#fff;background:var(--dots),radial-gradient(circle at 110% -10%,rgba(255,255,255,.25) 0 120px,rgba(255,255,255,0) 121px),var(--gHero);display:flex;flex-direction:column;gap:6px}
.float{margin:-44px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.float>div{border-radius:20px;padding:14px;background:#fff;box-shadow:var(--sh2);display:flex;flex-direction:column;gap:4px}
.big{font-family:"Plus Jakarta Sans",sans-serif;font-size:32px;font-weight:800}
.dotsnav{display:flex;gap:6px;justify-content:center}.dotsnav i{width:6px;height:6px;border-radius:3px;background:#CBD2E0}.dotsnav i.on{width:24px;background:linear-gradient(90deg,#1D4ED8,#BE185D)}
.ob1{min-height:100%;padding:calc(24px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between;gap:20px;color:#fff;background:radial-gradient(rgba(255,255,255,.13) 1.2px,transparent 1.4px) 0 0/18px 18px,linear-gradient(165deg,#047857 0%,#0E7490 25%,#1D4ED8 50%,#6D28D9 75%,#BE185D 100%)}
.num{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:18px}
.switch{flex:none;width:48px;height:28px;border-radius:14px;padding:3px;display:flex;background:#CBD2E0}
.switch span{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.25)}
.switch.on{justify-content:flex-end;background:var(--gL)}.switch.on.R{background:var(--gR)}
.segw{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:#fff;box-shadow:0 4px 14px rgba(15,23,42,.06)}
.segw button{min-height:42px;border-radius:10px;font-size:14px;font-weight:700;color:var(--sub)}
.segw button.on{color:#fff;font-weight:800}.segw button.on.L{background:var(--gL)}.segw button.on.R{background:var(--gR)}
.quads{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quad{min-height:108px;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px;background:#F8FAFC;border:1px dashed #CBD2E0;color:#334155}
.quad.on{background:var(--dots),var(--gHero);color:#fff;border:none}
.quad small{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.quad b{font-size:14px;line-height:1.25}.quad span{font-size:11px;line-height:1.4}
.ins{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;background:#fff;box-shadow:var(--sh)}
.ins.wait{box-shadow:none;border:1px dashed #CBD2E0;background:#F8FAFC}
.dv{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:8px}.dv div{background:var(--line);overflow:hidden;display:flex}.dv div:first-child{justify-content:flex-end;border-radius:4px 0 0 4px}.dv div:last-child{border-radius:0 4px 4px 0}.dv i{display:block;height:100%}
.trend{height:120px;display:flex;align-items:flex-end;gap:6px}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--sub)}
.trend i{display:block;width:100%;border-radius:6px;background:#E6EAF3}
.sheet{position:absolute;inset:0;background:rgba(11,18,32,.55);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.sheet>.panel{border-radius:28px 28px 0 0;background:#fff;padding:10px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:#CBD2E0}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types button{min-height:56px;border-radius:14px;border:1px solid var(--bd);padding:8px 10px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.types button b{font-size:13px}.types button span{font-size:11px;color:var(--sub)}
.types button.on{border:2px solid #1D4ED8;background:#EFF6FF}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:#0B1220;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;max-width:90%;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.err{color:#B91C1C;font-size:14px}
.tag{padding:4px 10px;border-radius:10px;font-size:11px;font-weight:800;color:#fff}
.datechip{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);border-radius:12px;padding:2px}
.datechip button{width:34px;height:34px;color:#fff;font-size:18px;border-radius:10px}.datechip button:disabled{opacity:.35}
.datechip span{font-size:13px;font-weight:700;min-width:92px;text-align:center}

/* Begleiter-Animationen: je drei fürs Auftauchen und Verschwinden */
.bud{display:inline-block;transform-origin:50% 100%}
.budPop{animation:budPop .55s cubic-bezier(.2,.9,.3,1.3) both}
.budWiggle{animation:budWiggle .75s ease-out both}
.budHop{animation:budHop .7s ease-out both}
.budDrop{animation:budDrop .42s ease-in both}
.budSlide{animation:budSlide .45s ease-in both}
.budSpin{animation:budSpin .42s ease-in both}
@keyframes budPop{0%{opacity:0;transform:translateY(40px) scale(.6)}60%{opacity:1;transform:translateY(-8px) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes budWiggle{0%{opacity:0;transform:scale(.8)}30%{opacity:1;transform:scale(1) rotate(-8deg)}50%{transform:rotate(7deg)}70%{transform:rotate(-4deg)}85%{transform:rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes budHop{0%{opacity:0;transform:translateY(30px)}30%{opacity:1;transform:translateY(-18px)}50%{transform:translateY(0) scaleY(.94)}70%{transform:translateY(-8px)}100%{opacity:1;transform:none}}
@keyframes budDrop{0%{transform:none}25%{transform:translateY(-8px)}100%{opacity:0;transform:translateY(60px) scale(.7)}}
@keyframes budSlide{0%{transform:none}20%{transform:rotate(-6deg)}100%{opacity:0;transform:translateX(-120%) rotate(-12deg)}}
@keyframes budSpin{0%{transform:none}100%{opacity:0;transform:scale(0) rotate(200deg)}}
.bubIn{animation:bubIn .35s .25s ease-out both}
.bubOut{animation:bubOut .22s ease-in both}
@keyframes bubIn{0%{opacity:0;transform:translateY(8px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes bubOut{100%{opacity:0;transform:translateY(6px) scale(.96)}}
#ticker .tickIn{animation:tickIn .5s ease-out both}
@keyframes tickIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.bud,.bubIn,.bubOut,#ticker .tickIn{animation:none!important}}
/* Overlays: Ben groß, Danke-Blasen, Pop-ups */
#ov{position:fixed;inset:0;z-index:40;pointer-events:none}
#ov .ovw{position:absolute;inset:0;max-width:560px;margin:0 auto;pointer-events:auto;overflow:hidden}
.ovbg{position:absolute;inset:0;background:rgba(11,18,32,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .35s ease-out both}
.ovbg.out{animation:fadeOut .3s ease-in both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes fadeOut{to{opacity:0}}
.benFig{position:absolute;bottom:calc(-6px + env(safe-area-inset-bottom));pointer-events:none}
.benFig.R{right:-30px}.benFig.L{left:-30px}
.flyR{animation:flyR .95s cubic-bezier(.3,1.25,.5,1) both}.flyL{animation:flyL .95s cubic-bezier(.3,1.25,.5,1) both}.dropT{animation:dropT .9s cubic-bezier(.3,1.3,.5,1) both}
@keyframes flyR{0%{transform:translateX(130%) rotate(22deg)}65%{transform:translateX(-6%) rotate(-6deg)}100%{transform:none}}
@keyframes flyL{0%{transform:translateX(-130%) rotate(-22deg)}65%{transform:translateX(6%) rotate(6deg)}100%{transform:none}}
@keyframes dropT{0%{transform:translateY(-120vh)}70%{transform:translateY(4%) scaleY(.94)}100%{transform:none}}
.outR{animation:outR .45s ease-in both}.outL{animation:outL .45s ease-in both}.outD{animation:outD .45s ease-in both}
@keyframes outR{to{transform:translateX(140%) rotate(18deg)}}@keyframes outL{to{transform:translateX(-140%) rotate(-18deg)}}@keyframes outD{to{transform:translateY(130%)}}
.bob{animation:bob 3.2s 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.benCard{position:absolute;left:14px;right:14px;top:calc(16px + env(safe-area-inset-top));border-radius:28px;padding:20px;color:#fff;box-shadow:0 24px 60px rgba(2,6,23,.4);display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 230px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-y:auto;animation:cardPop .55s .45s cubic-bezier(.2,1.3,.4,1) both;transform-origin:70% 100%}
.benCard.out,.dCard.out{animation:cardOut .3s ease-in both}
@keyframes cardPop{0%{opacity:0;transform:scale(.4) translateY(30px)}100%{opacity:1;transform:none}}
@keyframes cardOut{from{opacity:1}to{opacity:0;transform:scale(.85) translateY(20px)}}
.dBub{position:absolute;left:0;top:0;animation:bubFly 2.6s cubic-bezier(.45,.05,.55,.95) both}
@keyframes bubFly{0%{transform:translate(var(--x0),var(--y0)) scale(.45);opacity:0}12%{opacity:1}50%{transform:translate(var(--x1),var(--y1)) scale(1)}88%{transform:translate(var(--x2),var(--y2)) scale(1.04);opacity:1}100%{transform:translate(var(--x2),var(--y2)) scale(1.7);opacity:0}}
.wob{animation:wob 1.3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:scale(1,1)}25%{transform:scale(1.06,.95)}50%{transform:scale(.96,1.05)}75%{transform:scale(1.03,.98)}}
.hTrail{position:absolute;color:#FDA4AF;animation:hRise 1.8s ease-out infinite}
@keyframes hRise{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(var(--sx),-160px) scale(1.1);opacity:0}}
.hBurst{position:absolute;left:0;top:0;opacity:0;animation:hBurst 1.3s ease-out both}
@keyframes hBurst{0%{transform:translate(var(--cx),var(--cy)) scale(.3);opacity:0}15%{opacity:1}100%{transform:translate(calc(var(--cx) + var(--dx)),calc(var(--cy) + var(--dy))) scale(1.1);opacity:0}}
.dCard{position:absolute;left:18px;right:18px;top:24%;border-radius:28px;padding:20px 20px 16px;background:#fff;box-shadow:0 30px 70px rgba(76,5,25,.35);display:flex;flex-direction:column;gap:6px;animation:cardPop .55s 2.45s cubic-bezier(.2,1.3,.4,1) both}
.popIn{animation:popIn .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes popIn{0%{opacity:0;transform:scale(.6) translateY(10px)}100%{opacity:1;transform:none}}
.pops{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.popc{border-radius:18px;padding:12px 14px;background:#fff;box-shadow:0 10px 26px rgba(15,23,42,.10);display:flex;flex-direction:column;gap:4px;text-align:left}
.popc b{font-size:15px;line-height:1.3}.popc span{font-size:12px;color:var(--sub);line-height:1.4}
.trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ticon{flex:none;width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,#EFF6FF,#FDF2F8)}
.tbtn{flex:none;width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}

<body>
<div id="app"></div>
<div id="ov"></div>
<script>
'use strict';
/* ================= Hilfen ================= */
const $app = document.getElementById('app');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const monday = (s) => { const d = parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const dayIdx = (s) => (parse(s).getDay() + 6) % 7; // 0 = Montag
const WD = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const nice = (s) => { const d = parse(s); return WD[d.getDay()] + ', ' + d.getDate() + '. ' + MON[d.getMonth()]; };
const short = (s) => { const d = parse(s); return WD[d.getDay()].slice(0, 2) + ', ' + d.getDate() + '.' + (d.getMonth() + 1) + '.'; };
const kw = (s) => { const d = parse(s); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 86400000 + 1) / 7); };
const pct = (x) => x == null ? '–' : Math.round(x * 100) + ' %';
const fmt = (x, d) => x == null ? '–' : (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toString().replace('.', ',');
const mean = (xs) => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
const greet = () => { const h = new Date().getHours(); return h < 11 ? 'Guten Morgen' : h < 17 ? 'Hallo' : 'Guten Abend'; };
const store = {
  get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* voll oder gesperrt */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* egal */ } }
};
const P = {
  home: 'M3 11l9-7l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  plus: 'M12 5v14M5 12h14',
  chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
  link: 'M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1',
  sliders: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M16 6m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M10 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M18 18m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0',
  x: 'M6 6l12 12M18 6L6 18', back: 'M15 6l-6 6l6 6', check: 'M5 12l5 5l9-10', arrow: 'M5 12h14M13 6l6 6l-6 6',
  lock: 'M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z', logo: 'M12 3v18M5 9c0 4 3 7 7 7s7-3 7-7'
};
const svg = (d, c, s, w) => '<svg width="' + (s || 20) + '" height="' + (s || 20) + '" viewBox="0 0 24 24" fill="none" stroke="' + (c || 'currentColor') + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"></path></svg>';

/* ================= Zustand ================= */
const S = {
  conn: store.get('lt_conn', null), sum: store.get('lt_sum', null), prefs: store.get('lt_prefs', { personal: false }),
  view: 'home', ob: 0, ci: 'leben', date: iso(new Date()), drafts: {}, busy: false, toast: '', setupErr: '',
  sheet: null, anp: null, done: null, before: null, bridge: null, obSel: null
};
let toastT = null;
function toast(m) { S.toast = m; render(); clearTimeout(toastT); toastT = setTimeout(() => { S.toast = ''; render(); }, 3200); }
const today = () => (S.sum && S.sum.today) || iso(new Date());

/* ================= Server ================= */
async function api(action, payload) {
  const c = S.conn;
  const res = action === 'summary'
    ? await fetch(c.url + '?action=summary&token=' + encodeURIComponent(c.token), { redirect: 'follow' })
    : await fetch(c.url, { method: 'POST', redirect: 'follow', body: JSON.stringify(Object.assign({ token: c.token, action }, payload)) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Unbekannter Fehler');
  return j.data;
}
function setSum(d) { S.sum = d; store.set('lt_sum', d); S.drafts = {}; }
async function flushQueue() {
  const q = store.get('lt_queue', []);
  while (q.length) { const it = q[0]; setSum(await api(it.action || 'saveDay', it.action ? it.payload : it)); q.shift(); store.set('lt_queue', q); }
}
async function refresh(silent) {
  if (!S.conn) return;
  try { await flushQueue(); setSum(await api('summary')); if (!silent) toast('Aktualisiert'); }
  catch (e) { if (!silent) toast(navigator.onLine ? 'Fehler: ' + e.message : 'Offline – gespeicherte Daten'); }
  if (S.view === 'summary') S.view = 'home';
  render();
  checkOv();
}

/* ================= Konfiguration ================= */
function cfgRows(area) { return (S.sum && S.sum.cfg[area]) || []; }
function cfg(area) {
  const rows = cfgRows(area).filter((r) => r.act !== false);
  const by = (t) => rows.filter((r) => r.t === t);
  const wc = by('Wochencheck');
  const isText = (r) => r.key === 'wc_text' || /freitext/i.test(r.h);
  return {
    ratings: by('Bewertung').map((r) => ({ f: r.f, inv: !!r.inv, score: r.score !== false })),
    weekly: by('Woche').filter((r) => r.score !== false).map((r) => ({ f: r.f, target: r.z || 1 })),
    monthly: by('Monat').map((r) => ({ f: r.f, target: r.z || 1 })),
    acts: by('Woche').concat(by('Aktivität')).map((r) => r.f),
    zeit: by('Zeit').map((r) => ({ f: r.f, key: r.key })),
    ctx: by('Kontext').map((r) => r.f),
    wcRate: (wc.filter((r) => !isText(r))[0] || {}).f || null,
    wcText: (wc.filter(isText)[0] || {}).f || null
  };
}
function fk(area, key, fallback) { const r = cfgRows(area).find((x) => x.key === key); return r ? r.f : fallback; }
const entries = (area) => (S.sum && S.sum.entries[area]) || [];
const mine = (area) => entries(area).filter((e) => e.p === S.sum.me);

/* ================= Entwürfe und Speichern ================= */
function draft(area, date) {
  area = area || S.ci; date = date || S.date;
  const k = area + '|' + date;
  if (S.drafts[k]) return S.drafts[k];
  const C = cfg(area);
  const d = { ratings: {}, acts: {}, zeit: {}, ctx: {}, note: '', wcRate: null, wcText: '', monthly: {}, ctxOpen: false };
  mine(area).forEach((e) => {
    if (e.d === date) {
      if (e.t === 'Bewertung') d.ratings[e.f] = e.v;
      else if (e.t === 'Aktivität') d.acts[e.f] = true;
      else if (e.t === 'Zeit') d.zeit[e.f] = e.v;
      else if (e.t === 'Kontext' && e.f === 'Tagesnotiz') d.note = e.n;
      else if (e.t === 'Kontext') d.ctx[e.f] = true;
      else if (e.t === 'Wochencheck' && e.f === C.wcRate) d.wcRate = e.v;
      else if (e.t === 'Wochencheck' && e.f === C.wcText) d.wcText = e.n;
    }
    if (e.t === 'Monatsziel' && e.d.slice(0, 7) === date.slice(0, 7)) d.monthly[e.f] = true;
  });
  C.zeit.forEach((z) => { if (d.zeit[z.f] == null) d.zeit[z.f] = 0; });
  S.drafts[k] = d;
  return d;
}
function payload(area, date) {
  const d = draft(area, date), C = cfg(area), list = [];
  Object.keys(d.ratings).forEach((f) => { if (d.ratings[f]) list.push({ t: 'Bewertung', f, v: d.ratings[f] }); });
  Object.keys(d.acts).forEach((f) => { if (d.acts[f]) list.push({ t: 'Aktivität', f, v: 1 }); });
  Object.keys(d.zeit).forEach((f) => { if (d.zeit[f] > 0) list.push({ t: 'Zeit', f, v: d.zeit[f] }); });
  Object.keys(d.ctx).forEach((f) => { if (d.ctx[f]) list.push({ t: 'Kontext', f, v: 1 }); });
  if (d.note.trim()) list.push({ t: 'Kontext', f: 'Tagesnotiz', v: '', n: d.note.trim() });
  if (C.wcRate && d.wcRate) list.push({ t: 'Wochencheck', f: C.wcRate, v: d.wcRate });
  if (C.wcText && d.wcText.trim()) list.push({ t: 'Wochencheck', f: C.wcText, v: '', n: d.wcText.trim() });
  return { area, date, entries: list, monthly: Object.keys(d.monthly).filter((f) => d.monthly[f]) };
}
async function saveArea(area, date) {
  const p = payload(area, date);
  try { setSum(await api('saveDay', p)); return true; }
  catch (e) {
    if (!navigator.onLine || e instanceof TypeError) {
      const q = store.get('lt_queue', []).filter((x) => x.action || !(x.area === p.area && x.date === p.date));
      q.push(p); store.set('lt_queue', q);
      toast('Offline gespeichert, wird später übertragen');
      return true;
    }
    toast('Fehler: ' + e.message); return false;
  }
}

/* ================= Kennzahlen ================= */
function scoresNow() {
  const L = (S.sum && S.sum.scores.leben) || [], R = (S.sum && S.sum.scores.liebe) || [];
  const me = S.sum ? S.sum.me : '';
  const l = L[0] || {}, r = R[0] || {};
  return {
    leben: l.score != null ? l.score : null, lebenDaily: l.daily, lebenWk: l.wk, lebenMo: l.mo,
    liebe: r.joint != null ? r.joint : null, liebeWk: r.wk, liebeMo: r.mo, gap: r.gap,
    meScore: r.score ? r.score[me] : null, meFeel: r.feel ? r.feel[me] : null,
    histL: L.slice(0, 8).map((x) => x.score).reverse(), histR: R.slice(0, 8).map((x) => x.joint).reverse(),
    histMe: R.slice(0, 8).map((x) => (x.score ? x.score[me] : null)).reverse(), weeks: L.slice(0, 8).map((x) => x.w).reverse()
  };
}
function weekCount(area, f, date) {
  const mon = monday(date || today()), end = addDays(mon, 7), set = {};
  entries(area).forEach((e) => { if (e.t === 'Aktivität' && e.f === f && e.d >= mon && e.d < end && !(e.p === S.sum.me && e.d === S.date && S.drafts[area + '|' + S.date])) set[e.d] = 1; });
  const dk = area + '|' + S.date;
  if (S.drafts[dk] && S.drafts[dk].acts[f] && S.date >= mon && S.date < end) set[S.date] = 1;
  return Object.keys(set).length;
}
function goalStatus(area) {
  const t = today(), di = dayIdx(t), left = 6 - di;
  return cfg(area).weekly.map((w) => {
    const done = weekCount(area, w.f, t), expected = w.target * (di + 1) / 7;
    return { area, f: w.f, target: w.target, done, left, expected, reached: done >= w.target, deficit: expected - done, impossible: w.target - done > left + 1 };
  });
}
function byDay(list) {
  const m = {};
  list.forEach((e) => { const x = (m[e.d] = m[e.d] || { r: {}, a: {}, z: {}, c: {} });
    if (e.t === 'Bewertung') x.r[e.f] = e.v; else if (e.t === 'Aktivität') x.a[e.f] = 1; else if (e.t === 'Zeit') x.z[e.f] = e.v; else if (e.t === 'Kontext') x.c[e.f] = 1; });
  return m;
}
function streak() {
  const days = {}; mine('leben').concat(mine('liebe')).forEach((e) => { days[e.d] = 1; });
  let n = 0, d = today(); if (!days[d]) d = addDays(d, -1);
  while (days[d]) { n++; d = addDays(d, -1); }
  return n;
}
function ratingAvg(area, f, from, to, person) {
  const xs = entries(area).filter((e) => e.t === 'Bewertung' && e.f === f && e.d >= from && e.d < to && (!person || e.p === person) && e.v != null).map((e) => e.v);
  return mean(xs);
}
function lastDays(area, pred, n) { // wie viele der letzten n Tage (inkl. heute) erfüllen pred(dayObj)
  const M = byDay(mine(area)); let k = 0;
  for (let i = 0; i < n; i++) { const d = addDays(today(), -i); if (M[d] && pred(M[d])) k++; }
  return k;
}
function daysSince(area, pred) {
  const M = byDay(area === 'liebe' ? entries('liebe') : mine(area));
  for (let i = 0; i < 60; i++) { const d = addDays(today(), -i); if (M[d] && pred(M[d])) return i; }
  return null;
}

/* ================= Feedback, To-dos, Empfehlung ================= */
function feedback() {
  const good = [], warn = [], t = today(), me = S.sum.me;
  const st = streak();
  goalStatus('leben').concat(goalStatus('liebe')).forEach((g) => { if (g.reached) good.push({ t: 'Wochenziel erreicht: ' + g.f, x: g.done + ' von ' + g.target + ' geschafft. Das zählt jetzt voll in deinen ' + (g.area === 'leben' ? 'Leben' : 'Liebe') + '-Score.', s: (g.area === 'leben' ? 'Du hast dein' : 'Ihr habt euer') + ' Wochenziel „' + g.f + '“ schon erreicht.' }); });
  if (st >= 3) good.push({ t: st + ' Tage in Folge eingecheckt', x: 'Regelmäßigkeit macht die Auswertung erst aussagekräftig.', s: 'Du bist jetzt schon ' + st + ' Tage in Folge dabei.' });
  const cmp = (area, key, fb, name, inverse) => {
    const f = fk(area, key, fb);
    const now = ratingAvg(area, f, addDays(t, -6), addDays(t, 1), me), prev = ratingAvg(area, f, addDays(t, -13), addDays(t, -6), me);
    if (now == null || prev == null) return;
    const diff = now - prev, better = inverse ? diff <= -0.5 : diff >= 0.5, worse = inverse ? diff >= 0.5 : diff <= -0.5;
    if (better) good.push({ t: name + ' hat sich verbessert', x: 'Schnitt der letzten 7 Tage: ' + fmt(now, 1) + ' statt ' + fmt(prev, 1) + '.', s: name + ' hat sich verbessert, im Schnitt von ' + fmt(prev, 1) + ' auf ' + fmt(now, 1) + '.' });
    if (worse) warn.push({ t: name + ' ist gesunken', x: 'Schnitt der letzten 7 Tage: ' + fmt(now, 1) + ' statt ' + fmt(prev, 1) + '. Schau, was sich verändert hat.', s: name + ' ist zuletzt gesunken, im Schnitt von ' + fmt(prev, 1) + ' auf ' + fmt(now, 1) + '.', tip: 'Magst du mal überlegen, was sich in den letzten Tagen verändert hat?' });
  };
  cmp('leben', 'schlaf', 'Schlaf', 'Dein Schlaf'); cmp('leben', 'stimmung', 'Stimmung', 'Deine Stimmung'); cmp('leben', 'stress', 'Stress', 'Dein Stress', true); cmp('liebe', 'verbundenheit', 'Verbundenheit', 'Deine Verbundenheit');
  const fS = fk('leben', 'stress', 'Stress');
  const hiStress = lastDays('leben', (x) => x.r[fS] >= 4, 7);
  if (hiStress >= 3) warn.push({ t: 'Stress an ' + hiStress + ' von 7 Tagen hoch', x: 'Plan bewusst Erholung ein, und sag deinem Partner, was du gerade brauchst.', s: 'Dein Stress war an ' + hiStress + ' der letzten 7 Tage hoch.', tip: 'Plan heute bewusst etwas Erholung ein und sag ruhig, was du gerade brauchst.' });
  const sc = scoresNow();
  if (sc.gap != null && sc.gap >= 20) warn.push({ t: 'Ihr erlebt die Woche unterschiedlich', x: sc.gap + ' Punkte Abstand im Gefühl. Ein kurzes „Wie geht es uns?“ hilft mehr als Raten.', s: 'Ihr erlebt die Woche gerade ziemlich unterschiedlich.', tip: 'Ein kurzes „Wie geht es uns?“ hilft mehr als Raten.' });
  const fB = fk('leben', 'bildschirm', 'Viel Bildschirm');
  const scr = lastDays('leben', (x) => x.c[fB], 5);
  if (scr >= 4) warn.push({ t: 'Viel Bildschirm an ' + scr + ' von 5 Tagen', x: 'Das geht oft auf Kosten der bewussten Zeit zu zweit. Wie wäre ein handyfreier Abend?', s: 'Du hattest an ' + scr + ' der letzten 5 Tage viel Bildschirmzeit.', tip: 'Wie wäre heute ein Abend ganz ohne Handy?' });
  const fG = fk('liebe', 'gespraech', 'Tiefes Gespräch');
  const ds = daysSince('liebe', (x) => x.a[fG]);
  if (mine('liebe').length > 5 && (ds == null || ds >= 5)) warn.push({ t: 'Länger kein tiefes Gespräch', x: (ds == null ? 'Bisher keins eingetragen' : 'Seit ' + ds + ' Tagen') + '. Frag heute nach dem Tag, ohne Handy daneben.', s: ds == null ? 'Ihr habt noch kein tiefes Gespräch eingetragen.' : 'Euer letztes tiefes Gespräch ist schon ' + ds + ' Tage her.', tip: 'Frag heute Abend einfach mal nach dem Tag, ohne Handy daneben.' });
  return { good, warn };
}
function todos() {
  const out = [], t = today();
  const behind = goalStatus('leben').concat(goalStatus('liebe')).filter((g) => !g.reached && g.deficit >= 0.5).sort((a, b) => b.deficit / b.target - a.deficit / a.target);
  const takeArea = (a) => { const g = behind.find((x) => x.area === a); if (g) out.push({ id: 'g-' + g.f, area: a, t: g.f, x: 'Stand ' + g.done + ' von ' + g.target + (g.left ? ', noch ' + g.left + (g.left === 1 ? ' Tag' : ' Tage') : ', letzter Tag'), why: 'Dein Wochenziel steht bei ' + g.done + ' von ' + g.target + (g.left ? ', und es ' + (g.left === 1 ? 'bleibt noch ein Tag.' : 'bleiben noch ' + g.left + ' Tage.') : ', und heute ist der letzte Tag der Woche.') }); };
  takeArea('leben'); takeArea('liebe');
  const fSl = fk('leben', 'schlaf', 'Schlaf'), fSt = fk('leben', 'stress', 'Stress');
  if (lastDays('leben', (x) => x.r[fSl] != null && x.r[fSl] <= 2, 2) >= 2) out.push({ id: 'sleep', area: 'leben', t: 'Vor 23 Uhr ins Bett', x: 'Schlaf zwei Nächte unter 3', why: 'Du hast zwei Nächte hintereinander nicht gut geschlafen.' });
  else if (lastDays('leben', (x) => x.r[fSt] >= 4, 2) >= 2) out.push({ id: 'stress', area: 'leben', t: '15 Minuten bewusst abschalten', x: 'Stress zwei Tage in Folge hoch', why: 'Dein Stress war zwei Tage in Folge hoch.' });
  const fG = fk('liebe', 'gespraech', 'Tiefes Gespräch');
  const ds = daysSince('liebe', (x) => x.a[fG]);
  if (ds != null && ds >= 3) out.push({ id: 'talk', area: 'liebe', t: 'Frag nach dem Tag, ohne Handy', x: 'Letztes tiefes Gespräch vor ' + ds + ' Tagen', why: 'Euer letztes tiefes Gespräch ist ' + ds + ' Tage her.' });
  (store.get('lt_bridge', {})[t] || []).forEach((b, i) => out.unshift({ id: 'b' + i, area: 'liebe', t: b, x: 'Aus deinem Check-in', why: 'Das hast du dir im Check-in vorgenommen.' }));
  if (out.length < 3) out.push({ id: 'thanks', area: 'liebe', t: 'Sag heute einmal bewusst Danke', x: 'Kleine Gesten tragen am meisten', why: 'Kleine Gesten tragen eine Beziehung oft am meisten.' });
  if (out.length < 3) out.push({ id: 'walk', area: 'leben', t: '20 Minuten raus an die Luft', x: 'Gut für Stimmung und Schlaf', why: 'Frische Luft tut Stimmung und Schlaf gut.' });
  const seen = {}; return out.filter((x) => !seen[x.id] && (seen[x.id] = 1)).slice(0, 3);
}
function recommendation(A) {
  const ok = A.insights.filter((i) => i.num != null);
  if (ok.length) { const i = ok[0]; return { t: i.head, x: i.text }; }
  const sc = scoresNow();
  if (sc.leben != null && sc.liebe != null && sc.liebe + 10 < sc.leben) return { t: 'Zeit zu zweit einplanen', x: 'Dir geht es gerade besser als euch beiden zusammen. Ein fester Abend ohne Handy hilft am schnellsten.' };
  if (sc.leben != null && sc.liebe != null && sc.leben + 10 < sc.liebe) return { t: 'Vergiss dich selbst nicht', x: 'Eure Beziehung läuft gut, dein eigenes Befinden hinkt hinterher. Was würde dir heute guttun?' };
  return { t: 'Kleine Momente zählen', x: 'Paare, die im Alltag oft aufeinander eingehen, bleiben zufriedener. Ein Blick, eine Frage, ein Danke reichen.' };
}
function needSummary() {

function alltagWeek(wStart, todayS) {
  todayS = todayS || today();
  if (!AL() || !wStart || wStart > todayS) return null;
  const wEnd = addDays(wStart, 7), days = Math.min(7, Math.max(1, Math.round((parse(todayS) - parse(wStart)) / 86400000) + 1));
  const [A, B] = names2(), comp = [], zExp = { [A]: 0, [B]: 0 }, zDone = { [A]: 0, [B]: 0 }, pool = { [A]: 0, [B]: 0 }, cnt = { [A]: 0, [B]: 0 };
  AL().done.forEach((d) => { if (d.d >= wStart && d.d < wEnd && d.d <= todayS && cnt[d.p] != null) cnt[d.p]++; });
  tasksAct().forEach((t) => {
    let exp, rows;
    if (t.r === 'Monat') {
      const ref = todayS < wEnd ? todayS : addDays(wEnd, -1), m0 = ref.slice(0, 7) + '-01', p = parse(ref), dim = new Date(p.getFullYear(), p.getMonth() + 1, 0).getDate();
      exp = t.n * p.getDate() / dim; rows = AL().done.filter((d) => d.id === t.id && d.d >= m0 && d.d <= ref);
    } else { exp = (t.r === 'Tag' ? t.n * 7 : t.n) * days / 7; rows = AL().done.filter((d) => d.id === t.id && d.d >= wStart && d.d < wEnd && d.d <= todayS); }
    if (exp <= 0) return;
    comp.push(Math.min(1, rows.length / exp));
    const by = { [A]: 0, [B]: 0 }; rows.forEach((d) => { if (by[d.p] != null) by[d.p]++; });
    if (t.resp === A || t.resp === B) { zExp[t.resp] += exp; zDone[t.resp] += Math.min(by[t.resp], exp); }
    else if (t.resp === 'Abwechselnd') [A, B].forEach((p) => { zExp[p] += exp / 2; zDone[p] += Math.min(by[p], exp / 2); });
    else { pool[A] += by[A]; pool[B] += by[B]; }
  });

  const completion = mean(comp), fair = [], zusage = {};
  [A, B].forEach((p) => { if (zExp[p] > 0) { zusage[p] = Math.min(1, zDone[p] / zExp[p]); fair.push(zusage[p]); } });
  const pt = pool[A] + pool[B]; if (pt > 0) fair.push(1 - Math.max(0, Math.abs(pool[A] - pool[B]) - 1) / pt);
  const fairness = fair.length ? mean(fair) : null;
  return { score: fairness == null ? completion : 0.5 * completion + 0.5 * fairness, completion, fairness, zusage, pool, cnt };
}
