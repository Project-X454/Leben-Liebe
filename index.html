<style>
:root{
  --ink:#0B1220;--sub:#5B6475;--line:#EEF1F6;--bd:#D5DBE7;--bg:#F4F6FB;
  --gL:linear-gradient(135deg,#047857 0%,#0E7490 55%,#1D4ED8 100%);
  --gR:linear-gradient(135deg,#BE123C 0%,#BE185D 55%,#A21CAF 100%);
  --gX:linear-gradient(90deg,#0E7490 0%,#1D4ED8 40%,#7C3AED 70%,#BE185D 100%);
  --gHero:linear-gradient(150deg,#047857 0%,#1D4ED8 45%,#6D28D9 75%,#BE185D 100%);
  --dots:radial-gradient(rgba(255,255,255,.15) 1.2px,transparent 1.4px) 0 0/14px 14px;
  --sh:0 6px 20px rgba(15,23,42,.06);--sh2:0 12px 30px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7C3AED;outline-offset:2px}
h1,h2,h3,.jk{font-family:"Plus Jakarta Sans",Inter,sans-serif;letter-spacing:-.02em}
h1{margin:0;font-size:26px;font-weight:800}
h2{margin:0;font-size:17px;font-weight:800}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:calc(18px + env(safe-area-inset-top)) 16px 24px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column}
.sub{font-size:12px;color:var(--sub)}
.small{font-size:13px;color:var(--sub);line-height:1.45}
.card{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:10px}
.list{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:4px 16px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.iconbtn{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 4px 14px rgba(15,23,42,.08);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn.glass{background:rgba(255,255,255,.18);box-shadow:none;color:#fff}
.btn{min-height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:800;font-size:15px;background:var(--gX);box-shadow:0 8px 20px rgba(124,58,237,.3);width:100%}
.btn.L{background:var(--gL);box-shadow:0 8px 20px rgba(29,78,216,.3)}.btn.R{background:var(--gR);box-shadow:0 8px 20px rgba(190,24,93,.3)}
.btn.white{background:#fff;color:#3B0764;box-shadow:0 10px 30px rgba(15,23,42,.25)}
.btn:disabled{opacity:.6}
.ghost{min-height:46px;border-radius:14px;background:#fff;border:1px solid var(--bd);font-weight:700;width:100%}
.link{font-size:13px;font-weight:700;color:var(--sub);min-height:40px}
.gradL{background:var(--dots),var(--gL)}.gradR{background:var(--dots),var(--gR)}
.score{position:relative;overflow:hidden;border-radius:22px;padding:14px 16px;color:#fff;display:flex;flex-direction:column;gap:2px}
.score.L{box-shadow:0 10px 24px rgba(14,116,144,.3)}.score.R{box-shadow:0 10px 24px rgba(190,24,93,.3)}
.score b.n{font-family:"Plus Jakarta Sans",sans-serif;font-size:36px;font-weight:800;line-height:1.1}
.pill{padding:3px 8px;border-radius:8px;font-size:11px;font-weight:800}
.pill.L{background:#ECFDF5;color:#065F46}.pill.R{background:#FFF1F2;color:#9F1239}.pill.N{background:#EEF1F6;color:#334155}.pill.W{background:rgba(255,255,255,.22);color:#fff}
.seg5{display:grid;grid-template-columns:repeat(5,38px);gap:4px;padding:3px;border-radius:12px;background:#EEF1F6;flex:none}
.seg5 button{height:38px;border-radius:9px;font-size:13px;font-weight:700;color:var(--sub)}
.seg5 button.on{color:#fff;font-weight:800}
.L .seg5 button.on,.seg5.L button.on{background:var(--gL);box-shadow:0 4px 10px rgba(29,78,216,.3)}
.seg5.R button.on{background:var(--gR);box-shadow:0 4px 10px rgba(190,24,93,.3)}
.seg5.W button.on{background:linear-gradient(135deg,#D97706,#BE123C);box-shadow:0 4px 10px rgba(190,18,60,.3)}
.rate{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:20px;border:1px solid var(--bd);background:#fff;font-size:13px;font-weight:600;color:#334155}

.chip.on{border-color:transparent;color:#fff;font-weight:700}.chip.on small{color:rgba(255,255,255,.85)}

.chip.ctx{border-style:dashed}.chip.ctx.on{background:#EEF1F6;color:#334155;border:1px solid #94A3B8}

.step{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px;display:flex;flex-direction:column;gap:8px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--bg);font-size:20px}
.stepper b{font-family:"Plus Jakarta Sans",sans-serif;font-size:20px;font-weight:800}
textarea,input[type=text],input[type=url],input[type=password]{width:100%;border:1px solid var(--bd);border-radius:16px;padding:12px 14px;font-size:15px;background:#fff;resize:none}

.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid #CBD2E0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.box.on{border:none;background:var(--gX)}

.good .ic{background:var(--gL)}.warn .ic{background:linear-gradient(135deg,#D97706,#BE123C)}

.reco{position:relative;overflow:hidden;border-radius:22px;padding:16px 18px;color:#fff;background:radial-gradient(circle at 100% 0%,rgba(255,255,255,.22) 0 60px,rgba(255,255,255,0) 61px),linear-gradient(135deg,#1D4ED8 0%,#6D28D9 60%,#BE185D 100%);display:flex;flex-direction:column;gap:6px}
.cap{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.behind{border-radius:20px;padding:14px 16px;background:#FFFBEB;border:1px solid #FDE68A;display:flex;flex-direction:column;gap:8px}
.head{padding:calc(16px + env(safe-area-inset-top)) 18px 16px;display:flex;flex-direction:column;gap:14px;color:#fff;border-radius:0 0 28px 28px}
.head.L{background:var(--dots),var(--gL);box-shadow:0 10px 30px rgba(14,116,144,.25)}
.head.R{background:repeating-radial-gradient(circle at 100% 0%,rgba(255,255,255,.12) 0 2px,rgba(255,255,255,0) 2px 18px),var(--gR);box-shadow:0 10px 30px rgba(190,24,93,.25)}
.prog{display:grid;grid-template-columns:1fr 1fr;gap:6px}.prog i{height:6px;border-radius:3px;background:rgba(255,255,255,.3)}.prog i.on{background:#fff}
.foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -6px 20px rgba(15,23,42,.06);display:flex;flex-direction:column;gap:8px}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -6px 20px rgba(15,23,42,.06)}
nav.tabs button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--sub)}
nav.tabs button.on{color:#1D4ED8}
nav.tabs .plus{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1D4ED8,#BE185D)}
.hero{padding:calc(24px + env(safe-area-inset-top)) 20px 64px;color:#fff;background:var(--dots),radial-gradient(circle at 110% -10%,rgba(255,255,255,.25) 0 120px,rgba(255,255,255,0) 121px),var(--gHero);display:flex;flex-direction:column;gap:6px}
.float{margin:-44px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.float>div{border-radius:20px;padding:14px;background:#fff;box-shadow:var(--sh2);display:flex;flex-direction:column;gap:4px}
.big{font-family:"Plus Jakarta Sans",sans-serif;font-size:32px;font-weight:800}
.dotsnav{display:flex;gap:6px;justify-content:center}.dotsnav i{width:6px;height:6px;border-radius:3px;background:#CBD2E0}.dotsnav i.on{width:24px;background:linear-gradient(90deg,#1D4ED8,#BE185D)}
.ob1{min-height:100%;padding:calc(24px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between;gap:20px;color:#fff;background:radial-gradient(rgba(255,255,255,.13) 1.2px,transparent 1.4px) 0 0/18px 18px,linear-gradient(165deg,#047857 0%,#0E7490 25%,#1D4ED8 50%,#6D28D9 75%,#BE185D 100%)}
.num{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:18px}
.switch{flex:none;width:48px;height:28px;border-radius:14px;padding:3px;display:flex;background:#CBD2E0}
.switch span{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.25)}
.switch.on{justify-content:flex-end;background:var(--gL)}.switch.on.R{background:var(--gR)}
.segw{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:#fff;box-shadow:0 4px 14px rgba(15,23,42,.06)}
.segw button{min-height:42px;border-radius:10px;font-size:14px;font-weight:700;color:var(--sub)}
.segw button.on{color:#fff;font-weight:800}.segw button.on.L{background:var(--gL)}.segw button.on.R{background:var(--gR)}
.quads{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quad{min-height:108px;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px;background:#F8FAFC;border:1px dashed #CBD2E0;color:#334155}
.quad.on{background:var(--dots),var(--gHero);color:#fff;border:none}
.quad small{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.quad b{font-size:14px;line-height:1.25}.quad span{font-size:11px;line-height:1.4}
.ins{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;background:#fff;box-shadow:var(--sh)}
.ins.wait{box-shadow:none;border:1px dashed #CBD2E0;background:#F8FAFC}
.dv{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:8px}.dv div{background:var(--line);overflow:hidden;display:flex}.dv div:first-child{justify-content:flex-end;border-radius:4px 0 0 4px}.dv div:last-child{border-radius:0 4px 4px 0}.dv i{display:block;height:100%}
.trend{height:120px;display:flex;align-items:flex-end;gap:6px}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--sub)}
.trend i{display:block;width:100%;border-radius:6px;background:#E6EAF3}
.sheet{position:absolute;inset:0;background:rgba(11,18,32,.55);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.sheet>.panel{border-radius:28px 28px 0 0;background:#fff;padding:10px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:#CBD2E0}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types button{min-height:56px;border-radius:14px;border:1px solid var(--bd);padding:8px 10px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.types button b{font-size:13px}.types button span{font-size:11px;color:var(--sub)}
.types button.on{border:2px solid #1D4ED8;background:#EFF6FF}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:#0B1220;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;max-width:90%;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.err{color:#B91C1C;font-size:14px}
.tag{padding:4px 10px;border-radius:10px;font-size:11px;font-weight:800;color:#fff}
.datechip{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);border-radius:12px;padding:2px}
.datechip button{width:34px;height:34px;color:#fff;font-size:18px;border-radius:10px}.datechip button:disabled{opacity:.35}
.datechip span{font-size:13px;font-weight:700;min-width:92px;text-align:center}
</style>

<body>
<div id="app"></div>
<script>
'use strict';
/* ================= Hilfen ================= */
const $app = document.getElementById('app');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const monday = (s) => { const d = parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const dayIdx = (s) => (parse(s).getDay() + 6) % 7; // 0 = Montag
const WD = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const nice = (s) => { const d = parse(s); return WD[d.getDay()] + ', ' + d.getDate() + '. ' + MON[d.getMonth()]; };
const short = (s) => { const d = parse(s); return WD[d.getDay()].slice(0, 2) + ', ' + d.getDate() + '.' + (d.getMonth() + 1) + '.'; };
const kw = (s) => { const d = parse(s); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 86400000 + 1) / 7); };
const pct = (x) => x == null ? '–' : Math.round(x * 100) + ' %';
const fmt = (x, d) => x == null ? '–' : (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toString().replace('.', ',');
const mean = (xs) => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
const greet = () => { const h = new Date().getHours(); return h < 11 ? 'Guten Morgen' : h < 17 ? 'Hallo' : 'Guten Abend'; };
const store = {
  get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* voll oder gesperrt */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* egal */ } }
};
const P = {
  home: 'M3 11l9-7l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  plus: 'M12 5v14M5 12h14',
  chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
  link: 'M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1',
  sliders: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M16 6m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M10 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M18 18m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0',
  x: 'M6 6l12 12M18 6L6 18', back: 'M15 6l-6 6l6 6', check: 'M5 12l5 5l9-10', arrow: 'M5 12h14M13 6l6 6l-6 6',
  lock: 'M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z', logo: 'M12 3v18M5 9c0 4 3 7 7 7s7-3 7-7'
};
const svg = (d, c, s, w) => '<svg width="' + (s || 20) + '" height="' + (s || 20) + '" viewBox="0 0 24 24" fill="none" stroke="' + (c || 'currentColor') + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"></path></svg>';

/* ================= Zustand ================= */
const S = {
  conn: store.get('lt_conn', null), sum: store.get('lt_sum', null), prefs: store.get('lt_prefs', { personal: false }),
  view: 'home', ob: 0, ci: 'leben', date: iso(new Date()), drafts: {}, busy: false, toast: '', setupErr: '',
  sheet: null, anp: null, done: null, before: null, bridge: null, obSel: null
};
let toastT = null;
function toast(m) { S.toast = m; render(); clearTimeout(toastT); toastT = setTimeout(() => { S.toast = ''; render(); }, 3200); }
const today = () => (S.sum && S.sum.today) || iso(new Date());

/* ================= Server ================= */
async function api(action, payload) {
  const c = S.conn;
  const res = action === 'summary'
    ? await fetch(c.url + '?action=summary&token=' + encodeURIComponent(c.token), { redirect: 'follow' })
    : await fetch(c.url, { method: 'POST', redirect: 'follow', body: JSON.stringify(Object.assign({ token: c.token, action }, payload)) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Unbekannter Fehler');
  return j.data;
}
function setSum(d) { S.sum = d; store.set('lt_sum', d); S.drafts = {}; }
async function flushQueue() {
  const q = store.get('lt_queue', []);
  while (q.length) { setSum(await api('saveDay', q[0])); q.shift(); store.set('lt_queue', q); }
}
async function refresh(silent) {
  if (!S.conn) return;
  try { await flushQueue(); setSum(await api('summary')); if (!silent) toast('Aktualisiert'); }
  catch (e) { if (!silent) toast(navigator.onLine ? 'Fehler: ' + e.message : 'Offline – gespeicherte Daten'); }
  if (S.view === 'home' && needSummary()) S.view = 'summary';
  render();
}

/* ================= Konfiguration ================= */
function cfgRows(area) { return (S.sum && S.sum.cfg[area]) || []; }
function cfg(area) {
  const rows = cfgRows(area).filter((r) => r.act !== false);
  const by = (t) => rows.filter((r) => r.t === t);
  const wc = by('Wochencheck');
  const isText = (r) => r.key === 'wc_text' || /freitext/i.test(r.h);
  return {
    ratings: by('Bewertung').map((r) => ({ f: r.f, inv: !!r.inv, score: r.score !== false })),
    weekly: by('Woche').filter((r) => r.score !== false).map((r) => ({ f: r.f, target: r.z || 1 })),
    monthly: by('Monat').map((r) => ({ f: r.f, target: r.z || 1 })),
    acts: by('Woche').concat(by('Aktivität')).map((r) => r.f),
    zeit: by('Zeit').map((r) => ({ f: r.f, key: r.key })),
    ctx: by('Kontext').map((r) => r.f),
    wcRate: (wc.filter((r) => !isText(r))[0] || {}).f || null,
    wcText: (wc.filter(isText)[0] || {}).f || null
  };
}
function fk(area, key, fallback) { const r = cfgRows(area).find((x) => x.key === key); return r ? r.f : fallback; }
const entries = (area) => (S.sum && S.sum.entries[area]) || [];
const mine = (area) => entries(area).filter((e) => e.p === S.sum.me);

function draft(area, date) {

  const k = area + '|' + date;
  if (S.drafts[k]) return S.drafts[k];
  const C = cfg(area);
  const d = { ratings: {}, acts: {}, zeit: {}, ctx: {}, note: '', wcRate: null, wcText: '', monthly: {}, ctxOpen: false };
  mine(area).forEach((e) => {
    if (e.d === date) {
      if (e.t === 'Bewertung') d.ratings[e.f] = e.v;
      else if (e.t === 'Aktivität') d.acts[e.f] = true;
      else if (e.t === 'Zeit') d.zeit[e.f] = e.v;
      else if (e.t === 'Kontext' && e.f === 'Tagesnotiz') d.note = e.n;
      else if (e.t === 'Kontext') d.ctx[e.f] = true;
      else if (e.t === 'Wochencheck' && e.f === C.wcRate) d.wcRate = e.v;
      else if (e.t === 'Wochencheck' && e.f === C.wcText) d.wcText = e.n;
    }
    if (e.t === 'Monatsziel' && e.d.slice(0, 7) === date.slice(0, 7)) d.monthly[e.f] = true;
  });
  C.zeit.forEach((z) => { if (d.zeit[z.f] == null) d.zeit[z.f] = 0; });
  S.drafts[k] = d;
  return d;
}
function payload(area, date) {
  const d = draft(area, date), C = cfg(area), list = [];
  Object.keys(d.ratings).forEach((f) => { if (d.ratings[f]) list.push({ t: 'Bewertung', f, v: d.ratings[f] }); });
  Object.keys(d.acts).forEach((f) => { if (d.acts[f]) list.push({ t: 'Aktivität', f, v: 1 }); });
  Object.keys(d.zeit).forEach((f) => { if (d.zeit[f] > 0) list.push({ t: 'Zeit', f, v: d.zeit[f] }); });
  Object.keys(d.ctx).forEach((f) => { if (d.ctx[f]) list.push({ t: 'Kontext', f, v: 1 }); });
  if (d.note.trim()) list.push({ t: 'Kontext', f: 'Tagesnotiz', v: '', n: d.note.trim() });
  if (C.wcRate && d.wcRate) list.push({ t: 'Wochencheck', f: C.wcRate, v: d.wcRate });
  if (C.wcText && d.wcText.trim()) list.push({ t: 'Wochencheck', f: C.wcText, v: '', n: d.wcText.trim() });

}

function compare(days, cond, outcome, lag, minN) {
  const A = [], B = [];
  days.forEach((d) => { const c = cond(d); if (c == null) return; const o = outcome(lag ? addDays(d, lag) : d); if (o == null) return; (c ? A : B).push(o); });
  return { ok: A.length >= minN && B.length >= minN, nA: A.length, nB: B.length, a: mean(A), b: mean(B), diff: A.length && B.length ? mean(A) - mean(B) : null, min: minN };
}

}

    ((r.t === 'Bewertung' || r.t === 'Woche' || r.t === 'Monat') ? '<div class="li" style="border-top:none"><div class="col" style="flex:1"><b style="font-size:14px">Zählt in den Score</b><span class="sub">Aus: wird nur beobachtet</span></div><button class="switch ' + (r.score !== false ? 'on' : '') + '" role="switch" aria-checked="' + (r.score !== false) + '" data-a="sheetFlag" data-v="score" aria-label="Zählt in den Score"><span></span></button></div>' : '') +
    (r.t === 'Bewertung' ? '<div class="li"><div class="col" style="flex:1"><b style="font-size:14px">Umgekehrt werten</b><span class="sub">Hoher Wert ist schlecht, z. B. Stress</span></div><button class="switch ' + (r.inv ? 'on' : '') + '" role="switch" aria-checked="' + !!r.inv + '" data-a="sheetFlag" data-v="inv" aria-label="Umgekehrt werten"><span></span></button></div>' : '') +
    (!isNew ? '<div class="li"><div class="col" style="flex:1"><b style="font-size:14px">In der App anzeigen</b><span class="sub">Aus: ausgeblendet, Verlauf bleibt</span></div><button class="switch ' + (r.act !== false ? 'on' : '') + '" role="switch" aria-checked="' + (r.act !== false) + '" data-a="sheetFlag" data-v="act" aria-label="In der App anzeigen"><span></span></button></div>' +
      '<div class="li"><button class="ghost" style="flex:1" data-a="sheetMove" data-v="-1">Nach oben</button><button class="ghost" style="flex:1" data-a="sheetMove" data-v="1">Nach unten</button></div>' : '') + '</div>' +
    (s.err ? '<p class="err" style="margin:0">' + esc(s.err) + '</p>' : '') +
    '<button class="btn ' + (L ? 'L' : 'R') + '" data-a="sheetOk">' + (isNew ? 'Hinzufügen' : 'Übernehmen') + '</button>' +
    (!isNew && !r.orig ? '<button class="link" data-a="sheetDel" style="align-self:center;color:#B91C1C">Wieder entfernen</button>' : '') + '</div></div>';
}
function render() {
  const sc = document.querySelector('.scroll'), top = sc ? sc.scrollTop : 0, fid = document.activeElement && document.activeElement.id;
  let h;
  if (!S.conn || !S.sum) h = vSetup();
  else if (S.view === 'onboarding') h = vOnboarding();
  else if (S.view === 'summary') h = vSummary();
  else if (S.view === 'checkin') h = vCheckin();
  else if (S.view === 'done') h = vDone();
  else if (S.view === 'verlauf') h = vVerlauf();
  else if (S.view === 'analyse') h = vAnalyse();
  else if (S.view === 'anpassen') h = vAnpassen();
  else h = vHome();
  h += vSheet();
  if (S.toast) h += '<div class="toast" role="status">' + esc(S.toast) + '</div>';
  $app.innerHTML = h;
  const sc2 = document.querySelector('.scroll'); if (sc2 && S.keepScroll) sc2.scrollTop = top;
  S.keepScroll = false;
  if (fid) { const el = document.getElementById(fid); if (el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT')) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* type=url */ } } }
}
function go(v) { S.view = v; S.sheet = null; render(); const sc = document.querySelector('.scroll'); if (sc) sc.scrollTop = 0; }

/* ================= Bedienung ================= */
$app.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.dataset.in) { const d = draft(S.ci, S.date); d[t.dataset.in] = t.value; }
  if (t.dataset.in2 && S.sheet) S.sheet.row[t.dataset.in2] = t.value;
});
function newActs(area) {
  const d = draft(area, S.date), saved = {};
  mine(area).forEach((e) => { if (e.d === S.date && e.t === 'Aktivität') saved[e.f] = 1; });
  return Object.keys(d.acts).filter((f) => d.acts[f] && !saved[f]);
}
function gainedItems(area, acts) {
  const st = goalStatus(area);
  return acts.map((f) => st.find((g) => g.f === f)).filter(Boolean).map((g) => ({ f: g.f, area, reached: g.reached, done: g.done, target: g.target }));
}
function bridgeSuggestions() {
  const d = draft('leben', S.date), out = [];
  const st = d.ratings[fk('leben', 'stress', 'Stress')], sl = d.ratings[fk('leben', 'schlaf', 'Schlaf')];
  if (st >= 4) out.push({ text: '<b>Dein Stress liegt heute bei ' + st + '.</b> Magst du kurz sagen, dass du heute etwas Ruhe brauchst? Das hilft, Missverständnisse zu vermeiden.', todo: 'Sagen, dass ich heute Ruhe brauche' });
  else if (sl && sl <= 2) out.push({ text: '<b>Du hast schlecht geschlafen.</b> Ein früher gemeinsamer Abend tut euch beiden gut.', todo: 'Früher gemeinsamer Abend' });
  if (d.acts[fk('leben', 'sport', 'Sport')] || (d.ratings[fk('leben', 'stimmung', 'Stimmung')] >= 4)) out.push({ text: '<b>Gute Laune heute.</b> Teil sie: Erzähl, was dir heute gutgetan hat.', todo: 'Erzählen, was mir heute gutgetan hat' });
  return out.slice(0, 1);
}
$app.addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v, f = b.dataset.f, i = b.dataset.i != null ? Number(b.dataset.i) : null;
  if (a === 'connect') {
    const url = document.getElementById('su').value.trim(), token = document.getElementById('st').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) { S.setupErr = 'Die Adresse muss mit https://script.google.com/macros/s/ beginnen und mit /exec enden.'; render(); return; }
    S.conn = { url, token }; S.busy = true; S.setupErr = ''; render();
    try { setSum(await api('summary')); store.set('lt_conn', S.conn); S.view = store.get('lt_onboarded', false) ? 'home' : 'onboarding'; if (!store.get('lt_snap', null)) takeSnap(); }
    catch (e) { S.conn = null; S.setupErr = 'Verbindung fehlgeschlagen: ' + e.message; }
    S.busy = false; render(); return;
  }
  // Onboarding
  if (a === 'obNext') { S.ob++; go('onboarding'); return; }
  if (a === 'obBack') { S.ob = Math.max(0, S.ob - 1); go('onboarding'); return; }
  if (a === 'obSkip') { store.set('lt_onboarded', true); if (!store.get('lt_snap', null)) takeSnap(); go('home'); return; }
  if (a === 'obAgain') { S.ob = 0; S.obSel = null; go('onboarding'); return; }
  if (a === 'obTog') { S.obSel[f].act = !S.obSel[f].act; S.keepScroll = true; render(); return; }
  if (a === 'obZ') { S.obSel[f].z = Math.max(1, Math.min(14, (S.obSel[f].z || 1) + Number(v))); S.keepScroll = true; render(); return; }
  if (a === 'obDone') {
    const rows = cfgRows('leben'); let changed = false;
    const out = rows.map((r) => { const s = S.obSel && S.obSel[r.f]; const n = Object.assign({ orig: r.f }, r); if (s) { if (s.act !== (r.act !== false)) { n.act = s.act; changed = true; } if (r.t === 'Woche' && s.z !== r.z) { n.z = s.z; changed = true; } } return n; });
    if (changed) { S.busy = true; render(); try { setSum(await api('saveCriteria', { area: 'leben', rows: out })); } catch (e) { toast('Fehler: ' + e.message); } S.busy = false; }
    store.set('lt_onboarded', true); if (!store.get('lt_snap', null)) takeSnap(); go('home'); return;
  }
  if (a === 'sumDone') { takeSnap(); go('home'); return; }
  if (a === 'go') { if (v === 'anpassen') anpInit('leben'); go(v); return; }
  if (a === 'todo') { const all = store.get('lt_todo', {}); const t = today(); all[t] = all[t] || {}; all[t][v] = !all[t][v]; Object.keys(all).forEach((k) => { if (k < addDays(t, -7)) delete all[k]; }); store.set('lt_todo', all); S.keepScroll = true; render(); return; }
  // Check-in
  if (a === 'startCheckin') { S.ci = 'leben'; S.date = today(); S.bridge = null; S.done = null; const sc = scoresNow(); S.before = { leben: sc.leben, liebe: sc.liebe }; go('checkin'); return; }
  if (a === 'closeCheckin') { go('home'); return; }
  if (a === 'day') { S.date = addDays(S.date, Number(v)); render(); return; }
  if (a === 'ciBack') { S.ci = 'leben'; go('checkin'); return; }
  if (a === 'ciNext' || a === 'ciOnlyLeben') {
    S.busy = true; render();
    const na = newActs('leben');
    const ok = await saveArea('leben', S.date); S.busy = false;
    if (!ok) { render(); return; }
    S.done = { before: S.before, items: gainedItems('leben', na) };
    if (a === 'ciOnlyLeben') { go('done'); return; }
    S.bridge = bridgeSuggestions(); S.ci = 'liebe'; go('checkin'); return;
  }
  if (a === 'ciFinish') {
    S.busy = true; render();
    const na = newActs('liebe');
    const ok = await saveArea('liebe', S.date); S.busy = false;
    if (!ok) { render(); return; }
    S.done = { before: S.before, items: ((S.done && S.done.items) || []).concat(gainedItems('liebe', na)) };
    go('done'); return;
  }
  if (a === 'bridgeKeep' || a === 'bridgeDrop') {
    const item = S.bridge[Number(v)];
    if (a === 'bridgeKeep') { const all = store.get('lt_bridge', {}); const t = today(); all[t] = (all[t] || []).concat([item.todo]); Object.keys(all).forEach((k) => { if (k < addDays(t, -3)) delete all[k]; }); store.set('lt_bridge', all); toast('Als To-do gemerkt'); }
    S.bridge.splice(Number(v), 1); S.keepScroll = true; render(); return;
  }
  // Teilen, Einstellungen
  if (a === 'share') { S.busy = true; try { setSum(await api('setShare', { share: !S.sum.share })); toast(S.sum.share ? 'Teilen eingeschaltet' : 'Teilen aus, geteilte Werte gelöscht'); } catch (e) { toast('Fehler: ' + e.message); } S.busy = false; S.keepScroll = true; render(); return; }

  if (a === 'refresh') { await refresh(false); anpInit(S.anp ? S.anp.area : 'leben'); render(); return; }

  if (a === 'anpBack') { if (S.anp && S.anp.dirty && !confirm('Ungespeicherte Änderungen verwerfen?')) return; S.anp = null; go('home'); return; }
  if (a === 'anpArea') { if (S.anp.dirty && !confirm('Ungespeicherte Änderungen verwerfen?')) return; anpInit(v); go('anpassen'); return; }
  if (a === 'anpZ') { const r = S.anp.rows[i]; r.z = Math.max(1, Math.min(14, (r.z || 1) + Number(v))); S.anp.dirty = true; S.keepScroll = true; render(); return; }
  if (a === 'anpScore') { const r = S.anp.rows[i]; r.score = r.score === false; S.anp.dirty = true; S.keepScroll = true; render(); return; }
  if (a === 'anpEdit') { S.sheet = { area: S.anp.area, i, row: Object.assign({}, S.anp.rows[i]) }; S.keepScroll = true; render(); return; }
  if (a === 'anpSave') {
    S.busy = true; render();
    try { setSum(await api('saveCriteria', { area: S.anp.area, rows: S.anp.rows.map((r) => ({ orig: r.orig || '', f: r.f, t: r.t, z: r.z, h: r.h, score: r.score !== false, inv: !!r.inv, act: r.act !== false, key: r.key || '' })) })); anpInit(S.anp.area); toast('Gespeichert'); }
    catch (e) { toast('Fehler: ' + e.message); }
    S.busy = false; render(); return;
  }
  if (a === 'newCrit') {
    const fromCi = S.view === 'checkin';
    if (fromCi || !S.anp || S.anp.area !== v) anpInit(v);
    S.sheet = { area: v, i: null, fromCi, row: { orig: '', f: '', t: v === 'leben' ? 'Woche' : 'Aktivität', z: 3, h: '', score: true, inv: false, act: true, key: '' } }; S.keepScroll = true; render(); return;
  }
  // Blatt
  const s = S.sheet;
  if (a === 'sheetClose') { S.sheet = null; S.keepScroll = true; render(); return; }
  if (a.indexOf('sheet') === 0 && !s) return;
  if (a === 'sheetType') { s.row.t = v; if ((v === 'Woche' || v === 'Monat') && !s.row.z) s.row.z = v === 'Woche' ? 3 : 1; render(); return; }
  if (a === 'sheetZ') { s.row.z = Math.max(1, Math.min(14, (s.row.z || 1) + Number(v))); render(); return; }
  if (a === 'sheetFlag') { if (v === 'score') s.row.score = s.row.score === false; if (v === 'inv') s.row.inv = !s.row.inv; if (v === 'act') s.row.act = s.row.act === false; render(); return; }
  if (a === 'sheetMove') {
    const rows = S.anp.rows, same = rows.map((r, k) => k).filter((k) => rows[k].t === s.row.t), pos = same.indexOf(s.i), to = same[pos + Number(v)];
    if (to == null) return; rows[s.i] = Object.assign(rows[s.i], s.row); const tmp = rows[to]; rows[to] = rows[s.i]; rows[s.i] = tmp; s.i = to; S.anp.dirty = true; render(); return;
  }
  if (a === 'sheetDel') { S.anp.rows.splice(s.i, 1); S.anp.dirty = true; S.sheet = null; render(); return; }
  if (a === 'sheetOk') {
    const name = String(s.row.f || '').trim();
    if (!name) { s.err = 'Bitte gib einen Namen ein.'; render(); return; }
    if (name === 'Tagesnotiz') { s.err = '„Tagesnotiz“ ist reserviert.'; render(); return; }
    if (S.anp.rows.some((r, k) => k !== s.i && r.f.toLowerCase() === name.toLowerCase())) { s.err = 'Diesen Namen gibt es schon.'; render(); return; }
    s.row.f = name;
    if (s.i == null) { const lastSame = S.anp.rows.map((r) => r.t).lastIndexOf(s.row.t); S.anp.rows.splice(lastSame >= 0 ? lastSame + 1 : S.anp.rows.length, 0, s.row); }
    else S.anp.rows[s.i] = s.row;
    S.anp.dirty = true; S.sheet = null; S.keepScroll = true;
    if (s.fromCi) {
      S.busy = true; render();
      try { const keep = S.drafts; setSum(await api('saveCriteria', { area: s.area, rows: S.anp.rows.map((r) => ({ orig: r.orig || '', f: r.f, t: r.t, z: r.z, h: r.h, score: r.score !== false, inv: !!r.inv, act: r.act !== false, key: r.key || '' })) })); S.drafts = keep; toast('„' + name + '“ hinzugefügt'); }
      catch (e) { toast('Fehler: ' + e.message); }

  else if (a === 'act') d.acts[f] = !d.acts[f];
  else if (a === 'ctx') d.ctx[f] = !d.ctx[f];
  else if (a === 'ctxToggle') d.ctxOpen = !d.ctxOpen;

window.addEventListener('online', () => refresh(true));

});
